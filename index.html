<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <title>Redirect</title>
</head>

<body>

    <script>
        (function () {
            const lang = navigator.language || navigator.userLanguage;

            if (lang.startsWith("pt")) {
                window.location.href = "/pt/index.html";
            } else {
                window.location.href = "/en/index.html";
            }
        })();
    </script>

</body>

</html>
