<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultoria | Ricardo da Rocha</title>
    <meta name="description" content="➗ Custeio de produtos" />
    <style> 
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
         #login {
            display: none;
            max-width: 350px;
            margin: 80px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: center;
        }
    
        #login input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }
    
        #login button {
            width: 100%;
            padding: 10px;
            cursor: pointer;
        }
        .iframe-container {
            width: 100%;
            height: 100vh;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<div id="login">
    <h2>Acesso</h2>
    <p>Informe o ID do cliente</p>

    <input
        type="id_cliente"
        id="cliente"
        placeholder="A8F45"
        autocomplete="on">

    <button onclick="entrar()">Entrar</button>
</div>

<div id="iframe-container">
    <iframe id="iframe" title="🥗 Custeio de Produtos"></iframe>
</div>

<script>
  const cliente = new URLSearchParams(location.search).get("cliente");

if (cliente) {
    document.getElementById("iframe-container").style.display = "block";
    document.getElementById("iframe").src =
        "https://ocurriculo.online:3001/custeio.html?cliente=" +
        encodeURIComponent(cliente);
} else {
    document.getElementById("login").style.display = "block";
}

function entrar() {
    const valor = document.getElementById("cliente").value.trim();

    if (!valor) {
        alert("Informe o ID do cliente.");
        return;
    }

    location.search = "?cliente=" + encodeURIComponent(valor);
}

document.getElementById("cliente").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        entrar();
    }
});
</script>

</body>
</html>
